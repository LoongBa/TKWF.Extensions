name: CI & Publish (Extensions)

# TKWF.Extensions 统一 CI + NuGet 发布（2026-09-15 独立构建模式 + Trusted Publishing）
#
# 触发：
# - push main / PR：构建 + 全量测试回归
# - push tag（{扩展名}/v*，如 Permissions/v0.9.1 / Account.Abstractions/v0.1.1）：构建 + 测试 + Pack + 推送 NuGet（--skip-duplicate）
# - workflow_dispatch：手动触发
#
# 独立构建模式（2026-09-15 迁移：ProjectReference → PackageReference）：
# 扩展经 PackageReference 引用主框架 NuGet 包（TKWF.Domain 4.10.24 等，版本集中 Directory.Packages.props），
# SG1 分析器经纯 Analyzer 包 TKWF.CodeGeneration（analyzers/dotnet/cs/，Roslyn 自动加载）。
# → 无需检出主框架源码、无需 build/refs，CI 从 nuget.org 直接还原，完全独立。
#
# Trusted Publishing（2026-09-15）：
# publish job 经 GitHub OIDC（id-token: write）→ NuGet/login@v1 换取短时效临时 API key（≈1h）→ push。
# nuget.org 端校验 trusted publishing policy（repo=LoongBa/TKWF.Extensions + workflow=ci-publish.yml）；
# 唯一 secret 为 NUGET_USER（nuget.org 用户名，公开信息，非 API key）。无需长期 API key secrets。

on:
  push:
    branches: [main]
    tags: ['**/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_OUTPUT: ./nupkgs
  # 双模式（2026-09-16 方案 B）：CI/发布走 NuGet 消费方视角（false = PackageReference）
  UseLocalFw: 'false'
  # 4.10.27（含 Utility.Analytics）发布前 Analytics 依赖本地 ProjectReference 无法走 nuget——
  # 门控排除（true = CI 包含 Analytics，需 4.10.27 已发布；false = 跳过 Analytics）
  ANALYTICS_ENABLED: 'false'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 双模式（2026-09-16 方案 B）：UseLocalFw=false → PackageReference（nuget 消费方视角）。
      # slnx 不支持按 MSBuild 属性排除项目——Analytics 4.10.27 发布前用显式项目列表构建。
      # 生成项目列表：slnx 全部项目 - Analytics（${{ env.ANALYTICS_ENABLED }} == 'true' 时含 Analytics）
      - name: Resolve project list
        id: projlist
        run: |
          # 从 slnx 提取项目路径（排除 slnx 自身），Analytics 门控
          PROJECTS=$(grep -oP 'Project Path="\K[^"]+' TKWF.Extensions.slnx || true)
          if [ "${{ env.ANALYTICS_ENABLED }}" = "false" ]; then
            PROJECTS=$(echo "$PROJECTS" | grep -v -i analytics || true)
          fi
          # 转为引号包裹的空格分隔（dotnet build 多项目）
          LIST=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            LIST="$LIST \"$line\""
          done <<< "$PROJECTS"
          echo "projects=$LIST" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ${{ steps.projlist.outputs.projects }} --nologo

      - name: Build
        run: dotnet build ${{ steps.projlist.outputs.projects }} -c Release --no-restore --nologo

      - name: Test
        run: dotnet test ${{ steps.projlist.outputs.projects }} -c Release --no-build --verbosity normal

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack ${{ steps.projlist.outputs.projects }} -c Release --no-build -o ${{ env.NUGET_OUTPUT }} --nologo

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          retention-days: 7

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Trusted Publishing：允许 GitHub 向该 job 签发 OIDC token（免 API key）
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org 用户名（profile name，非邮箱）——唯一需要配置的 secret（公开信息）
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: |
          dotnet nuget push ${{ env.NUGET_OUTPUT }}/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate