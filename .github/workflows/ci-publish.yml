name: CI & Publish (Extensions)

# TKWF.Extensions 统一 CI + NuGet 发布（2026-09-15 独立构建模式）
#
# 触发：
# - push main / PR：构建 + 全量测试回归
# - push tag（{扩展名}/v*，如 Permissions/v0.9.1 / Account.Abstractions/v0.1.1）：构建 + 测试 + Pack + 推送 NuGet（--skip-duplicate）
# - workflow_dispatch：手动触发
#
# 独立构建模式（2026-09-15 迁移：ProjectReference → PackageReference）：
# 扩展经 PackageReference 引用主框架 NuGet 包（TKWF.Domain 4.10.24 等，版本集中 Directory.Packages.props），
# SG1 分析器经纯 Analyzer 包 TKWF.CodeGeneration（analyzers/dotnet/cs/，Roslyn 自动加载）。
# → 无需检出主框架源码、无需 build/refs，CI 从 nuget.org 直接还原，完全独立。

on:
  push:
    branches: [main]
    tags: ['**/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_OUTPUT: ./nupkgs

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build -c Release --no-restore --nologo

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack -c Release --no-build -o ${{ env.NUGET_OUTPUT }} --nologo

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          retention-days: 7

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}

      - name: Push NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ${{ env.NUGET_OUTPUT }}/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key $NUGET_API_KEY \
            --skip-duplicate
