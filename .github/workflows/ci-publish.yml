name: CI & Publish (Extensions)

# TKWF.Extensions 统一 CI + NuGet 发布
# - PR / push main：构建 + 测试全量回归（对齐主框架 ci-publish 门禁）
# - tag 推入（{扩展名}/v*，如 Permissions/v0.9.0 / Account.Abstractions/v0.1.0）：构建 + 测试 + Pack + 推送 NuGet
#
# 依赖主框架（_TKWF）源码：扩展经 $(TKWFSourceRoot) ProjectReference 引用上一级 ../_TKWF，
# 且 SG1 分析器用主框架 build/refs 预编译 DLL（未入库，主框架构建时 _PushToRefs 生成）。
# CI 布局：主框架检出到 $GITHUB_WORKSPACE/../_TKWF（checkout path 支持 ../），与本地布局一致；
# build/refs 由 prepare-core job 编译主框架生成后传 artifact。

on:
  push:
    branches: [main]
    tags: ['**/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_OUTPUT: ./nupkgs

jobs:
  prepare-core:
    # 检出主框架 + 编译生成 build/refs（SG1 分析器预编译 DLL 来源）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LoongBa/TKW.Framework
          path: _TKWF
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build core framework (generate build/refs)
        run: dotnet build -c Release --nologo
        working-directory: _TKWF

      - name: Upload core refs
        uses: actions/upload-artifact@v4
        with:
          name: core-refs
          path: _TKWF/build/refs
          retention-days: 1

  build-test:
    needs: prepare-core
    runs-on: ubuntu-latest
    steps:
      # 扩展仓库检出到 $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 主框架检出到上一级（path 相对 workspace 支持 ../，与本地 ../_TKWF 布局一致）
      - uses: actions/checkout@v4
        with:
          repository: LoongBa/TKW.Framework
          path: ../_TKWF
          fetch-depth: 0

      # refs 下载到主框架检出目录（prepare-core 已编译生成）
      - name: Download core refs
        uses: actions/download-artifact@v4
        with:
          name: core-refs
          path: ${{ github.workspace }}/../_TKWF/build/refs

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build -c Release --no-restore --nologo

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack -c Release --no-build -o ${{ env.NUGET_OUTPUT }} --nologo

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          retention-days: 7

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ${{ env.NUGET_OUTPUT }}

      - name: Push NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ${{ env.NUGET_OUTPUT }}/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key $NUGET_API_KEY \
            --skip-duplicate
